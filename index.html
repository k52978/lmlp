<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Iguaçu PHOTOBUS - Acervo organizado e contato</title>
<style>
  :root{ --azul:#A9A9A9; }
  *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
  body{background:white;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
  .tela{display:none;flex-direction:column;height:100vh;height:100dvh;min-height:0}
  .tela.ativa{display:flex}
  .topo-cinza{height:14px;background:#A9A9A9;flex-shrink:0;width:100%}
  #tela1 .topo-vazio{flex:0 0 46%;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 20px;font-family:'Quicksand',ui-rounded,'SF Pro Rounded',sans-serif}
  .logo-blog{width:min(120px,32vw);height:auto;display:block}
  .rodape-fino{flex-shrink:0;padding:10px 14px 18px;text-align:left;font-size:19px;font-weight:800;line-height:1.15;color:#6f6f6f;box-shadow:none;}
  .rodape-fino small{display:block}
  .logo-nome{font-size:38px;font-weight:600;letter-spacing:-0.5px;line-height:1;color:#0094DA;font-family:'Quicksand',ui-rounded,'SF Pro Rounded','Segoe UI Rounded',sans-serif}
  .logo-pill{background:#0094DA;color:white;border-radius:999px;padding:2px 18px 4px;font-size:32px;font-weight:700;letter-spacing:0;line-height:1.1;margin-top:4px;display:inline-block;font-family:'Quicksand',ui-rounded,'SF Pro Rounded','Segoe UI Rounded',sans-serif}
  .logo-sub{display:none}
  #tela1 .meio{display:flex;flex-direction:row;justify-content:center;align-items:center;gap:8px;padding:20px 28px 0;width:100%;position:relative;z-index:5;pointer-events:auto}
  #tela1 .espaco{flex:1}
  .btn-click{background:#A9A9A9;color:white;border:none;border-radius:999px;flex:1;height:44px;font-size:16px;font-weight:700;font-family:'Quicksand',ui-rounded,'SF Pro Rounded',sans-serif;cursor:pointer;pointer-events:auto;position:relative;z-index:5;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px}
  .btn-centro{background:#A9A9A9;color:white;border:none;border-radius:999px;flex:1;height:44px;font-size:16px;font-weight:700;font-family:'Quicksand',ui-rounded,'SF Pro Rounded',sans-serif;cursor:pointer;pointer-events:auto;position:relative;z-index:5;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px}
  #btnEmpresas{background:#A9A9A9}
  .btn-click svg,.btn-centro svg{width:20px;height:20px;flex-shrink:0;pointer-events:none}
  #topoEmpresas h1{color:#000;font-size:30px;font-weight:400;letter-spacing:0}
  #topoEmpresas{background:#D9D9D9;box-shadow:none;padding:10px 14px 8px;min-height:48px}
  #topoEmpresas .voltar svg path{stroke:#000}
  .pesquisa-empresas{padding:10px 14px 10px;background:#D9D9D9}
  .pesquisa-campo{height:48px;border:1.5px solid #000;border-radius:999px;padding:0 16px;background:#fff;box-shadow:none}
  .pesquisa-campo:focus-within{border-color:#000}
  .pesquisa-lupa{width:22px;height:22px;color:#000}
  .pesquisa-empresas input{font-size:17px;font-weight:400;color:#000}
  .pesquisa-empresas input::placeholder{color:#555;font-weight:400}
  .topo-azul{background:white;color:white;display:flex;align-items:center;height:auto;min-height:44px;padding:8px 12px 6px;gap:12px;user-select:none;box-shadow:0 2px 8px rgba(0,0,0,.18);position:relative;z-index:2}
  .voltar{cursor:pointer;display:flex;align-items:center}
  .topo-azul h1{font-size:23px;flex:1;font-weight:900;letter-spacing:-0.5px;color:#A6CC39}
  .form{flex:1;padding:32px 28px 15px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
  #tela2 .form label{font-weight:400}
  #tela2 .topo-azul h1{font-weight:400}
  #tela2 .btn-enviar{cursor:pointer;pointer-events:auto;position:relative;z-index:5;font-weight:400}
  #tela2 input, #tela2 textarea{font-weight:400}
  #tela2 .form input{border-bottom:1px solid #999}
  .form label{font-size:20px;font-weight:900;letter-spacing:-0.5px}
  .form input, .form select{border:none;border-bottom:3px solid black;outline:none;font-size:17px;padding:6px 4px;width:100%;font-weight:800;background:white}
  .caixa-msg{border:4px solid black;border-radius:32px;height:140px;padding:14px;margin-top:12px}
  .caixa-msg textarea{width:100%;height:100%;border:none;outline:none;font-size:18px;font-weight:900;resize:none}
  .btn-enviar:disabled{opacity:1;cursor:pointer}
  .btn-enviar{background:#A6CC39;color:white;border:none;height:58px;width:230px;font-size:20px;font-weight:900;cursor:pointer;border-radius:29px;display:block;margin:16px auto 20px auto;flex-shrink:0}
  .lista{flex:1;padding:2px 20px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
  .card{border:3px solid black;border-radius:18px;padding:14px}
  .card b{font-size:18px}
  .card p{font-size:16px;margin-top:4px;word-break:break-word}
  .card img{width:100%;height:auto;border-radius:10px;margin-top:10px;display:block}
  .btn-foto{background:white;border:3px dashed var(--azul);color:var(--azul);border-radius:12px;height:120px;font-size:18px;font-weight:900;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin-top:8px}
  .btn-foto span{font-size:32px}
  #previewFoto{width:100%;height:auto;border-radius:12px;margin-top:10px;display:none;border:2px solid #e5e5e5}
  .pesquisa-empresas{padding:18px 20px 4px;background:white}
  .pesquisa-campo{height:50px;border:2px solid #d5d5d5;border-radius:14px;padding:0 14px;display:flex;align-items:center;gap:10px}
  .pesquisa-campo:focus-within{border-color:var(--azul)}
  .pesquisa-lupa{width:21px;height:21px;flex-shrink:0;color:#777}
  .pesquisa-empresas input{width:100%;height:42px;border:0;background:transparent;padding:0;font-size:16px;font-weight:700;outline:none}
  .empresas-lista{flex:1;min-height:0;overflow-y:auto;padding:4px 0 28px;display:flex;flex-direction:column;gap:0}
  .emp{width:100%;background:white;border:none;border-bottom:1px solid rgba(0,0,0,0.08);border-radius:0;padding:4.95px 20px;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left}
  .emp-nome{font-weight:300 !important;font-size:18px;font-weight:300;letter-spacing:0;flex:1;line-height:1.15;font-family:inherit}
  .emp-nome.uma-linha{font-weight:300}
  .emp-nome.varias-linhas{font-weight:300}
  #tela5 .emp-bus{filter:none}
  .emp-bus{width:42px;height:42px;object-fit:contain;flex-shrink:0;border-radius:50%;background:#F7F9FB;padding:7px;box-sizing:border-box;box-shadow:none;}
  .fav-btn{background:none;border:none;cursor:pointer;padding:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .fav-btn svg{width:26px;height:26px;display:block}
  .fotos-lista{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px;overflow-y:auto;align-content:start}
  .foto-card{border:2px solid #e5e5e5;border-radius:12px;padding:4px;overflow:hidden}
  .foto-card img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block}
  .foto-card p{font-size:11px;font-weight:700;margin-top:4px;word-break:break-word}
  #statusPub{font-size:16px;font-weight:800;margin-top:10px;word-break:break-word;text-align:center}
  /* LOOP NA ABA EMPRESAS: nunca cobre cabecalho, pesquisa ou outras telas */
  #enviadoMsg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:20px;font-weight:900;color:#A6CC39;background:white;z-index:9999;display:none;pointer-events:none;}
  .rodape{height:40px;background:#0094DA;border-radius:26px 26px 0 0;box-shadow:none;flex-shrink:0;position:relative;z-index:10;display:flex;align-items:center;justify-content:center;gap:16px}
  .rodape-btn{background:none;border:none;color:white;font-size:22px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer;padding:10px 20px;border-radius:999px}
  .rodape-btn.ativo{background:rgba(255,255,255,.22)}
  .rodape-btn svg{width:24px;height:24px}
  .topo-bus{width:44px;height:44px;object-fit:cover;flex-shrink:0;border-radius:6px}
  .rodape-linha{height:3px;width:110px;background:white;border-radius:999px;flex-shrink:0}
  .rodape-bus{width:32px;height:32px;object-fit:cover;flex-shrink:0;border-radius:6px}
  .detro-loader-container{display:inline-flex;align-items:center;justify-content:center}
  #detro-native-canvas{display:block;width:50px;height:50px}
  #tela5 .rodape{background:#A6CC39;height:8px;border-radius:8px;box-shadow:0 -3px 8px rgba(0,0,0,.18);margin:0 12px 8px}
  #loopEmpresas{flex:1;min-height:0;background:white;display:none;flex-direction:column;justify-content:center;align-items:center;min-height:200px;width:100%}

/* ===== TOPO EMPRESAS: fino + 0,1% maior | azul #0094DA | fluorescente #A6CC39 ===== */
#tela5{background:#F7F8FA}
#topoEmpresas{
  background:linear-gradient(100deg,#0094DA 0%,#0094DA 42%,#A6CC39 100%) !important;
  border-radius:0 0 22.22px 22.22px;
  box-shadow:0 10px 24px rgba(0,148,218,.28),0 3px 8px rgba(0,0,0,.12);
  padding:10.11px 16px 12.13px !important;
  min-height:56.62px !important;
  gap:12px;
  position:relative;z-index:3;
}
#topoEmpresas h1{color:#fff !important;font-size:22.24px !important;font-weight:800 !important;letter-spacing:-0.3px;text-shadow:0 1px 2px rgba(0,0,0,.18)}
#topoEmpresas .voltar{background:none !important;border:none !important;box-shadow:none !important;width:auto !important;height:auto !important;padding:6px 4px;margin-left:-4px;border-radius:0}
#topoEmpresas .voltar:active{opacity:.65}
#topoEmpresas .voltar svg{width:26px;height:20px}
#topoEmpresas .voltar svg path{stroke:#fff !important;stroke-width:5}
#tela5 .pesquisa-empresas{background:transparent !important;padding:0 16px !important;margin-top:-14px;position:relative;z-index:4}
#tela5 .pesquisa-campo{height:48px !important;border:1px solid #E8ECEF !important;border-radius:999px !important;background:#fff !important;box-shadow:0 8px 20px rgba(15,40,60,.12),0 2px 6px rgba(15,40,60,.08);padding:0 16px}
#tela5 .pesquisa-campo:focus-within{border-color:#0094DA !important;box-shadow:0 8px 20px rgba(0,148,218,.18),0 2px 6px rgba(0,148,218,.10)}
#tela5 .pesquisa-lupa{color:#0094DA !important}
#tela5 .pesquisa-empresas input{font-size:16px;font-weight:500;color:#222}
#tela5 .pesquisa-empresas input::placeholder{color:#8A949E;font-weight:400}

  /* === MESMO TOPO DO EMPRESAS NOS DEMAIS TOPOS (Contato / Publicar / Empresa) === */
  .topo-azul{
    background:linear-gradient(100deg,#0094DA 0%,#0094DA 42%,#A6CC39 100%) !important;
    border-radius:0 0 22.22px 22.22px !important;
    box-shadow:0 10px 24px rgba(0,148,218,.28),0 3px 8px rgba(0,0,0,.12) !important;
    padding:10.11px 16px 12.13px !important;
    min-height:56.62px !important;
    height:auto !important;
    gap:12px !important;
    position:relative;z-index:3;
  }
  .topo-azul h1{
    color:#fff !important;
    font-size:22.24px !important;
    font-weight:800 !important;
    letter-spacing:-0.3px !important;
    text-shadow:0 1px 2px rgba(0,0,0,.18) !important;
  }
  .topo-azul .voltar{
    background:none !important;border:none !important;box-shadow:none !important;
    width:auto !important;height:auto !important;
    padding:6px 4px !important;margin-left:-4px !important;border-radius:0 !important;
  }
  .topo-azul .voltar:active{opacity:.65}
  .topo-azul .voltar svg{width:26px !important;height:20px !important}
  .topo-azul .voltar svg path{stroke:#fff !important;stroke-width:7 !important}

  /* === PUBLICAR SEM NEGRITO (tudo, menos o cabeçalho) === */
  #tela3 .form *, #tela3 .btn-enviar, #tela3 #statusPub, #tela3 .card, #tela3 .card *{font-weight:400 !important}
  #tela3 .caixa-msg textarea{font-weight:400 !important}
  /* === MENSAGEM (Contato) COM CONTORNO MAIS FINO === */
  #tela2 .caixa-msg{border:1.5px solid black !important}
  /* === LINHAS DO PUBLICAR MAIS FINAS (igual ao Mensagem: 1,5px) === */
  #tela3 .form input, #tela3 .form select{border-bottom:1.5px solid black !important}
  #tela3 .caixa-msg{border:1.5px solid black !important}
</style>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <script>
  (function () {
    const canvas = document.getElementById('detro-native-canvas');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const size = 50;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    ctx.scale(dpr, dpr);
    const center = size / 2;
    const radius = 18.38;
    const lineWidth = 4;
    const color = '#0094DA';
    function cubicBezier(t) {
      const p1x = 0.4, p1y = 0.0, p2x = 0.2, p2y = 1.0;
      let u = t;
      for (let i = 0; i < 6; i++) {
        const x = 3 * (1 - u) * (1 - u) * u * p1x + 3 * (1 - u) * u * u * p2x + u * u * u;
        const dx = 3 * (1 - u) * (1 - u) * p1x + 6 * (1 - u) * u * (p2x - p1x) + 3 * u * u * (1 - p2x);
        if (Math.abs(dx) < 1e-6) break;
        u -= (x - t) / dx;
      }
      return 3 * (1 - u) * (1 - u) * u * p1y + 3 * (1 - u) * u * u * p2y + u * u * u;
    }
    function interval(t, begin, end) {
      if (t <= begin) return 0;
      if (t >= end) return 1;
      return cubicBezier((t - begin) / (end - begin));
    }
    const velocidadeGeral = 0.95;
    const kIndeterminateCircularDuration = (1333 * 5) / velocidadeGeral;
    const twoPi = Math.PI * 2;
    const epsilon = 0.180018;
    function render(now) {
      ctx.clearRect(0, 0, size, size);
      const t = (now % kIndeterminateCircularDuration) / kIndeterminateCircularDuration;
      let headValue = 0;
      let tailValue = 0;
      let stepValue = 0;
      for (let i = 0; i < 5; i++) {
        const start = i * 0.2;
        const end = (i + 1) * 0.2;
        const mid = start + 0.09;
        if (t >= start) {
          headValue += interval(t, start, mid);
          tailValue += interval(t, mid, end);
          stepValue += interval(t, start, end);
        }
      }
      const rotationValue = t * 3;
      const startAngle = rotationValue * twoPi + tailValue * (twoPi * 0.70) + stepValue * (twoPi * 0.30);
      const arcSweep = Math.max(headValue * (twoPi * 0.70) - tailValue * (twoPi * 0.70), epsilon);
      ctx.beginPath();
      ctx.arc(center, center, radius, startAngle, startAngle + arcSweep);
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.lineCap = 'butt';
      ctx.stroke();
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  })();
  </script>

  );

    ...filtradas.filter(n => favs.includes(n)),

    d.className = "emp";

    bus.className = "emp-bus";
    bus.src = BUS_IMG;
    bus.alt = "";
    const nomeEl = document.createElement("div");
    nomeEl.className = "emp-nome";
    nomeEl.textContent = nome;
    const favBtn = document.createElement("button");
    favBtn.className = "fav-btn";
    favBtn.setAttribute("aria-label", fav ? "Desfavoritar " + nome : "Favoritar " + nome);
    favBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="' + (fav ? "#FFC107" : "none") + '" stroke="' + (fav ? "#FFC107" : "#9AA0A6") + '" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8 L14.9 8.7 L21.4 9.6 L16.7 14.2 L17.8 20.7 L12 17.6 L6.2 20.7 L7.3 14.2 L2.6 9.6 L9.1 8.7 Z"/></svg>';
    favBtn.addEventListener("click", (e)=> toggleFav(nome, e));
    d.appendChild(bus);
    d.appendChild(nomeEl);
    d.appendChild(favBtn);
    d.addEventListener("click", ()=> abrirEmpresa(nome));

    // Espessura do print: 1 linha = 500, passou de 1 linha = 600
    if(nomeEl.offsetHeight > 30){ nomeEl.classList.add("varias-linhas"); } else { nomeEl.classList.add("uma-linha"); }
  });
  div.scrollTop = scrollAntes;
}

function getRepoInfo(){
  const h = window.location.hostname || "";
  if(h.includes("github.io")){
    const owner = h.split(".")[0];
    const parts = window.location.pathname.split("/").filter(Boolean);
    return { owner, repo: parts[0] || "lmlp" };
  }
  return { owner: "k52978", repo: "lmlp" };
}
function getBranch(){ return "principal"; }

async function buscarAcervo(){
  const { owner, repo } = getRepoInfo();
  try{
    const resp = await fetch(`https://raw.githubusercontent.com/${owner}/${repo}/${getBranch()}/acervo.json?t=${Date.now()}`);
    if(!resp.ok) return [];
    const lista = await resp.json();
    return Array.isArray(lista) ? lista : [];
  }catch(e){ return []; }
}

      const txt = document.createElement("p");

}

}let fotoBase64 = "";
let fotoNomeOriginal = "foto.jpg";
function verFoto(input){
  let file = input.files[0];
  if(!file) return;
  fotoNomeOriginal = file.name;
  let reader = new FileReader();
  reader.onload = function(e){
    let img = new Image();
    img.onload = function(){
      let canvas = document.createElement("canvas");
      let max = 900;
      let w = img.width, h = img.height;
      if(w > max){ h = h * max / w; w = max; }
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      fotoBase64 = canvas.toDataURL("image/jpeg", 0.8);
      let prev = document.getElementById("previewFoto");
      prev.src = fotoBase64;
      prev.style.display = "block";
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
async function publicar(){
  const status = document.getElementById("statusPub");
  const token = document.getElementById("tokenGithub").value.trim();
  const empresa = document.getElementById("pubEmpresa").value;
  const legenda = document.getElementById("pubTexto").value;
  if(!token){ alert("Cola o Token do GitHub primeiro!"); return; }
  if(!fotoBase64){ alert("Escolhe a foto primeiro!"); return; }
  const { owner, repo } = getRepoInfo();
  const headers = { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "Content-Type": "application/json" };
  const baseUrl = `https://api.github.com/repos/${owner}/${repo}/contents`;
  try{
    status.textContent = "Enviando foto...";
    const apenasBase64 = fotoBase64.split(",")[1];
    const nomeArquivo = Date.now() + "-" + fotoNomeOriginal.replace(/\s/g, "-").replace(/[^a-zA-Z0-9._-]/g, "");
    const caminhoImagem = `imagens/${nomeArquivo}`;
    const upFoto = await fetch(`${baseUrl}/${caminhoImagem}`, {
      method: "PUT", headers,
      body: JSON.stringify({ message: "Nova foto " + empresa, content: apenasBase64, branch: getBranch() })
    });
    if(!upFoto.ok){ const err = await upFoto.json().catch(()=>({})); throw new Error("Erro ao enviar foto: " + (err.message || upFoto.status)); }
    status.textContent = "Atualizando acervo...";
    const getAcervo = await fetch(`${baseUrl}/acervo.json?ref=${getBranch()}`, { headers });
    let lista = [];
    let sha = null;
    if(getAcervo.status === 200){
      const dados = await getAcervo.json();
      sha = dados.sha;
      if(!dados.content || !sha) throw new Error("Não foi possível ler o acervo existente com segurança. Nenhuma foto antiga foi substituída.");
      try{
        const binario = atob(dados.content.replace(/\s/g, ""));
        const bytes = Uint8Array.from(binario, caractere => caractere.charCodeAt(0));
        const textoAcervo = new TextDecoder("utf-8").decode(bytes).replace(/^\uFEFF/, "");
        lista = JSON.parse(textoAcervo);
      }catch(e){
        throw new Error("O acervo existente não pôde ser interpretado. Para proteger as fotos antigas, a publicação foi interrompida sem limpar o arquivo. Detalhe: " + e.message);
      }
      if(!Array.isArray(lista)) throw new Error("O formato do acervo existente é inválido. Para proteger as fotos antigas, a publicação foi interrompida.");
    } else if(getAcervo.status === 404){ lista = []; }
    else { const err = await getAcervo.json().catch(()=>({})); throw new Error("Erro ao ler acervo: " + (err.message || getAcervo.status)); }
    lista.push({ empresa: empresa, legenda: legenda, imagem: caminhoImagem, data: new Date().toISOString() });
    const novoConteudo = btoa(unescape(encodeURIComponent(JSON.stringify(lista, null, 2))));
    const upAcervo = await fetch(`${baseUrl}/acervo.json`, {
      method: "PUT", headers,
      body: JSON.stringify({ message: "Atualiza acervo " + empresa, content: novoConteudo, ...(sha ? { sha } : {}), branch: getBranch() })
    });
    if(!upAcervo.ok){ const err = await upAcervo.json().catch(()=>({})); throw new Error("Erro ao salvar acervo: " + (err.message || upAcervo.status)); }
    status.textContent = "Publicado! Todo mundo já pode ver em " + empresa;
    document.getElementById("pubTexto").value = "";
    document.getElementById("pubFoto").value = "";
    document.getElementById("previewFoto").style.display = "none";
    fotoBase64 = "";
    carregarPub();
  }catch(e){ console.error(e); status.textContent = "Erro: " + e.message; }
}
async function carregarPub(){
  const div = document.getElementById("listaPub");
  div.innerHTML = "";
  const lista = await buscarAcervo();
  const { owner, repo } = getRepoInfo();
  if(lista.length === 0){ div.innerHTML = ""; return; }
  div.innerHTML = "";
  lista.slice().reverse().forEach((p)=>{
    const c = document.createElement("div"); c.className="card";
    const b = document.createElement("b"); b.textContent = p.empresa;
    const img = document.createElement("img");
    img.src = `https://raw.githubusercontent.com/${owner}/${repo}/${getBranch()}/${p.imagem}`;
    const txt = document.createElement("p"); txt.textContent = p.legenda || "";
    c.appendChild(b); c.appendChild(img); c.appendChild(txt);
    div.appendChild(c);
  });
}
